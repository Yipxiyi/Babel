[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "babel-epub"
version = "0.2.0"
description = "Layout-preserving EPUB translation pipeline for agentic chapter-by-chapter workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Babel contributors" }]
keywords = ["epub", "translation", "ebook", "codex", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = []

[project.scripts]
babel-epub = "babel_epub.cli:main"
babel-server = "babel_epub.web:main"
babel-mcp = "babel_epub.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
