name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          web_version = json.loads(Path("web/package.json").read_text())["version"]
          lock_version = json.loads(Path("web/package-lock.json").read_text())["version"]
          init_text = Path("src/babel_epub/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          package_version = match.group(1) if match else ""
          versions = {
              "pyproject.toml": project_version,
              "web/package.json": web_version,
              "web/package-lock.json": lock_version,
              "src/babel_epub/__init__.py": package_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Version mismatch: {versions}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", project_version):
              raise SystemExit(f"Unsupported release version: {project_version}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={project_version}\n")
              output.write(f"tag=v{project_version}\n")
          PY

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          notes_file="docs/releases/${TAG}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Babel ${TAG}" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Babel ${TAG}" \
              --generate-notes
          fi

      - name: Report existing release
        if: steps.existing.outputs.exists == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "${TAG} is already published; no changes were made."
